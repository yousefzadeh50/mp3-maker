<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ساخت مکالمه صوتی دو نفره (انگلیسی آمریکایی)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: "Vazirmatn", sans-serif; background: #f9f9fc; color: #222; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    textarea, select, input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
    textarea { height: 200px; resize: vertical; font-family: monospace; }
    button { margin-top: 20px; padding: 10px 20px; background: linear-gradient(90deg, #2b6cb0, #805ad5); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .status { margin-top: 16px; font-weight: bold; color: #2b6cb0; }
    .download-link { display: inline-block; margin-top: 12px; padding: 8px 12px; background: #edf2ff; border: 1px dashed #2b6cb0; border-radius: 6px; text-decoration: none; color: #2b6cb0; font-weight: bold; }
    .note { margin-top: 20px; font-size: 0.9rem; color: #555; }
  </style>
</head>
<body>
  <h1>ساخت مکالمه صوتی دو نفره (لهجه آمریکایی)</h1>
  <form id="voiceForm" method="POST" action="/generate">
    <label for="script">دیالوگ انگلیسی</label>
    <textarea id="script" name="script" dir="ltr">A: Hello! How are you today?
B: I'm doing well, thanks! What about you?
A: Great! Let's start our lesson.
B: Perfect, I'm ready!</textarea>

    <label for="voice1">صدای گوینده A</label>
    <select id="voice1" name="voice1">
      <option value="en-US-JennyNeural">Jenny (زن)</option>
      <option value="en-US-AriaNeural">Aria (زن)</option>
      <option value="en-US-SaraNeural">Sara (زن)</option>
      <option value="en-US-GuyNeural">Guy (مرد)</option>
      <option value="en-US-DavisNeural">Davis (مرد)</option>
      <option value="en-US-ChristopherNeural">Christopher (مرد)</option>
    </select>

    <label for="voice2">صدای گوینده B</label>
    <select id="voice2" name="voice2">
      <option value="en-US-GuyNeural">Guy (مرد)</option>
      <option value="en-US-DavisNeural">Davis (مرد)</option>
      <option value="en-US-ChristopherNeural">Christopher (مرد)</option>
      <option value="en-US-JennyNeural">Jenny (زن)</option>
      <option value="en-US-AriaNeural">Aria (زن)</option>
      <option value="en-US-SaraNeural">Sara (زن)</option>
    </select>

    <label for="rate">سرعت خواندن</label>
    <input type="text" id="rate" name="rate" value="1.0">

    <label for="pause">مکث بین جملات (ms)</label>
    <input type="number" id="pause" name="pause" value="350">

    <button type="submit">تولید فایل MP3</button>
  </form>

  <div class="note">
    نکته: برای طبیعی‌تر شدن گفتار، سرعت را کمی کمتر از ۱ (مثلاً ۰٫۹۵) و مکث‌ها را بین ۳۰۰ تا ۵۰۰ میلی‌ثانیه تنظیم کن.
  </div>
</body>
</html>
